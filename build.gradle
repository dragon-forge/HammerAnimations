plugins {
    id 'java'
    id 'idea'
    id "war"
    id "org.teavm" version "0.14.0"
}

group = 'org.zeith'
version = appVersion
compileJava {
    sourceCompatibility = targetCompatibility = "21"
}

java.sourceCompatibility = java.targetCompatibility = JavaVersion.VERSION_21

repositories {
    mavenCentral()
    maven {
        url = "https://maven.zeith.org"
    }
}

dependencies {
    implementation teavm.libs.jsoApis

    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"
    testCompileOnly "org.projectlombok:lombok:${lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok}"

    compileOnly "org.jetbrains:annotations:26.0.1"
    implementation "it.unimi.dsi:fastutil:8.5.15"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

teavm {

    all {
        mainClass = "org.zeith.hammeranims.standalone.wasm.Main"
    }
    wasmGC {
        targetFileName = "hammeranims.wasm"
        outputDir = file("binaries")
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
