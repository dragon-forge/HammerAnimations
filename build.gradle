buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        mavenCentral()
        maven {
            url = "https://repo.spongepowered.org/maven"
        }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.+', changing: true
    }
}

plugins {
    id "com.modrinth.minotaur" version "2.8.7"
//    id 'net.ltgt.apt' version '0.10'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: 'java'
apply from: 'https://maven.zeith.org/org/zeith/FixupFML/fix-v1.0.1-usercache.gradle'

ext.configFile = file("build.txt")
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse(prop)
    project.ext.hasConfig = { key ->
        return config.isSet(key);
    }
}

version = "${config.mod_version}"
group = "org.zeith.${config.mod_id}"
archivesBaseName = "${config.mod_id_fancy}-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    accessTransformers(
            file('libraries/dev_at.cfg'), // required for dev env to function
            file('src/main/resources/META-INF/accesstransformer.cfg')
    )

    runs {
        client {
            workingDirectory project.file('run/client')

            jvmArgs([
                    '-Dfml.coreMods.load=org.zeith.hammeranims.core.asm.HACoremod,com.zeitheron.hammercore.asm.HCASM',
                    '-Dmixin.hotSwap=true',
                    '-Dmixin.checks.interfaces=true',
                    '-Dmixin.debug.export=true',
                    "-XX:+UseConcMarkSweepGC",
                    "-XX:-UseAdaptiveSizePolicy"
            ])

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args([
                    "-username",
                    "Zeitheron",
                    "-uuid",
                    "63fa4c485b5640809727d5d59663e603"
            ])
        }

        server {
            workingDirectory project.file('run/server')

            jvmArgs([
                    '-Dfml.coreMods.load=org.zeith.hammeranims.core.asm.HACoremod,com.zeitheron.hammercore.asm.HCASM',
                    '-Dmixin.hotSwap=true',
                    '-Dmixin.checks.interfaces=true',
                    '-Dmixin.debug.export=true'
            ])

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

configurations {
    embed
    tcImplementation
    tcModsFolder
    implementation.extendsFrom(embed)
    implementation.extendsFrom(tcImplementation)
    implementation.extendsFrom(tcModsFolder)
}

repositories {
    mavenCentral()
    maven {
        name = "Zeith maven"
        url = "https://maven.zeith.org"
    }
    maven {
        url = "https://jitpack.io"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    tcImplementation "org.zeith.HammerLib:HammerLib-${minecraft_version}:${hl_version}:deobf"

    if (hasConfig("viveapi_version")) {
        compileOnly "org.zeith.viveapi:VivecraftAPI-${minecraft_version}:${config.viveapi_version}:deobf"
    }

    ////// UTILITY STUFF //////
    compileOnly "org.projectlombok:lombok:$lombok"
    annotationProcessor "org.projectlombok:lombok:$lombok"
    compileOnly 'org.jetbrains:annotations:24.0.1'
    ///////////////////////////

    implementation("net.minecraftforge:mergetool:0.2.3.3") { force = true }
}

configurations.configureEach {
    exclude group: "net.minecraftforge", module: "mergetool"
}

import net.minecraftforge.gradle.common.task.SignJar
import java.nio.file.Files

def startTasks = gradle.startParameter.taskNames
def intellijIDE = (System.getProperty("idea.sync.active") == "true" || System.getProperty("idea.active") == "true") && !startTasks.contains("build") && !startTasks.contains("buildAndUploadMod") && !startTasks.contains("publishAllPublicationsToMavenRepository") && !startTasks.contains("publish") && !startTasks.contains("jar")

println "Running IntelliJ IDE: " + intellijIDE

task cleanReplaces(type: Delete) {
    delete "build/sources/replaced"
}

if (tasks.contains(build) && !intellijIDE) {
    task applyReplaces(type: Copy) {
        from('src/main/java')
        into 'build/sources/replaced'

        filter { line ->
            line.replace('required-after:hammercore', "required-after:hammercore@[${hl_version},)")
                    .replace("@VERSION@", "${config.mod_version}")
        }
    }

    compileJava.dependsOn applyReplaces

    sourceSets {
        main {
            java {
                srcDirs = ["build/sources/replaced"]
            }
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property "version", config.mod_version
    inputs.property "mcversion", minecraft_version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        include 'pack.mcmeta'
        expand 'version': config.mod_version, 'mcversion': minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude 'pack.mcmeta'
    }
}


jar {
    from(configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'LICENSE.txt', 'META-INF/MANIFSET.MF', 'META-INF/maven/**', 'META-INF/*.RSA', 'META-INF/*.SF'
    }

    exclude "net/**"

    manifest {
        attributes([
                "ForceLoadAsMod"             : "true",
                "FMLCorePlugin"              : "org.zeith.hammeranims.core.asm.HACoremod",
                "FMLCorePluginContainsFMLMod": "false",
                "FMLAT"                      : "accesstransformer.cfg",

                "Specification-Title"        : "HammerAnimations",
                "Specification-Vendor"       : "DragonForge",
                "Specification-Version"      : "1", // We are version 1 of ourselves
                "Implementation-Title"       : "HammerAnimations",
                "Implementation-Version"     : "${config.mod_version}",
                "Implementation-Vendor"      : "DragonForge",
                "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('signJar', SignJar) {
    dependsOn jar
    onlyIf {
        System.env.MC_KS_PASS != null
    }
    keyStore = System.env.MC_KS_PATH
    alias = System.env.MC_KS_ALIAS
    storePass = System.env.MC_KS_PASS
    keyPass = System.env.MC_KS_PASS
    inputFile = jar.archivePath
    outputFile = jar.archivePath
}

jar.finalizedBy('reobfJar')
assemble.finalizedBy('signJar')
signJar.finalizedBy('cleanReplaces')

task deobfJar(type: Jar) {
    from sourceSets.main.output
    exclude "net/**"
    classifier = 'deobf'
    manifest {
        attributes([
                "ForceLoadAsMod"             : "true",
                "FMLCorePlugin"              : "org.zeith.hammeranims.core.asm.HACoremod",
                "FMLCorePluginContainsFMLMod": "false",
                "FMLAT"                      : "accesstransformer.cfg",

                "Specification-Title"        : "HammerAnimations",
                "Specification-Vendor"       : "DragonForge",
                "Specification-Version"      : "1", // We are version 1 of ourselves
                "Implementation-Title"       : "HammerAnimations",
                "Implementation-Version"     : "${config.mod_version}",
                "Implementation-Vendor"      : "DragonForge",
                "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task srcJar(type: Jar, dependsOn: classes) {
    from sourceSets.main.allSource
    exclude "net/**"
    classifier = 'sources'
    manifest {
        attributes([
                "ForceLoadAsMod"             : "true",
                "FMLCorePlugin"              : "org.zeith.hammeranims.core.asm.HACoremod",
                "FMLCorePluginContainsFMLMod": "false",
                "FMLAT"                      : "accesstransformer.cfg",

                "Specification-Title"        : "HammerAnimations",
                "Specification-Vendor"       : "DragonForge",
                "Specification-Version"      : "1", // We are version 1 of ourselves
                "Implementation-Title"       : "HammerAnimations",
                "Implementation-Version"     : "${config.mod_version}",
                "Implementation-Vendor"      : "DragonForge",
                "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

artifacts {
    archives deobfJar
    archives srcJar
}

modrinth {
    token = System.env.MODRINTH_TOKEN != null ? System.env.MODRINTH_TOKEN : "NONE"
    projectId = config.modrinth_project as String
    versionNumber = config.mod_version as String
    versionType = config.release_type as String
    uploadFile = jar
    gameVersions = [minecraft_version as String]
    additionalFiles = [deobfJar, srcJar]
    dependencies {
        def mods = (config.required_mods as String).split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        required.project pars[1].trim()
                    }
                } else
                    required.project one.trim()
            }

        mods = (config.optional_mods as String).split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        optional.project pars[1].trim()
                    }
                } else
                    optional.project one.trim()
            }

        mods = (config.incompatible_mods as String).split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        incompatible.project pars[1].trim()
                    }
                } else
                    incompatible.project one.trim()
            }

        mods = (config.embedded_mods as String).split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        embedded.project pars[1].trim()
                    }
                } else
                    embedded.project one.trim()
            }
    }
}

curseforge {
    apiKey = System.env.CURSEFORGE_API_KEY != null ? System.env.CURSEFORGE_API_KEY : '0'
    project {
        id = "${config.cf_project}"
        changelogType = 'html'
        changelog = ""
        releaseType = "${config.release_type}"
        addGameVersion "${minecraft_version}"
        addGameVersion "Forge"
        addGameVersion "Java 8"
        mainArtifact(jar) {
            displayName = "[${minecraft_version}] ${config.mod_name} - ${config.mod_version}"
        }
        addArtifact(deobfJar) {
            displayName = "[${minecraft_version}] ${config.mod_name} - ${config.mod_version} (Deobfuscated, for developers)"
        }
        addArtifact(srcJar) {
            displayName = "[${minecraft_version}] ${config.mod_name} - ${config.mod_version} (Source Code)"
        }
        relations {
            def mods = (config.required_mods as String).split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            requiredDependency pars[1].trim()
                        }
                    } else
                        requiredDependency one.trim()
                }

            mods = (config.optional_mods as String).split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            optionalDependency pars[1].trim()
                        }
                    } else
                        optionalDependency one.trim()
                }

            mods = (config.incompatible_mods as String).split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            incompatible pars[1].trim()
                        }
                    } else
                        incompatible one.trim()
                }

            mods = (config.embedded_mods as String).split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            embeddedLibrary pars[1].trim()
                        }
                    } else
                        embeddedLibrary one.trim()
                }
        }
    }
}

build.dependsOn signJar

tasks.register('copyDepsToRuntime') {
    doLast {
        def directories = []
        minecraft.runs.each {
            def f = new File(it.workingDirectory, "mods")
            directories.add(f)
            f.mkdirs()
            f.listFiles().each {
                if (it.getName().startsWith("__gradle__"))
                    it.delete()
            }
        }
        configurations.tcModsFolder.files.each {
            directories.each { File dir ->
                def runFile = new File(dir, "__gradle__${it.name}")
                runFile.delete()
                Files.copy(it.toPath(), runFile.toPath())
            }
        }
    }
}

tasks.register('buildAndUploadMod') {
    group = "upload"
    dependsOn "curseforge${config.cf_project}", 'modrinth'

    doLast {
        println "Upload complete."
    }
}

afterEvaluate {
    tasks["curseforge${config.cf_project}"].dependsOn.add(signJar)
    
    tasks['downloadAssets'].dependsOn.add('copyDepsToRuntime')

    tasks['downloadAssets'].dependsOn.add('fixupForgeJars')

    tasks["curseforge${config.cf_project}"].dependsOn.add(publish)
    tasks["modrinth"].dependsOn.add(publish)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = config.maven_group
            artifactId = config.mod_id_fancy + "-" + minecraft_version

            artifact jar
            artifact srcJar
            artifact deobfJar
        }
    }
    repositories {
        maven {
            url config.maven_url
        }
    }
}